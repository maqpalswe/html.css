<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapsirma</title>

    <style>
       .box{
            display: flex;
            flex-direction: row;
            height: 50px;
            background-color: blueviolet;
            align-items: center;
            color: white;
            justify-content: space-around;

       }
       .home{
            font-family: arial;
            color: white;
            width: 60px;
       }


       input{
            border-radius: 15px;
            border: none;
            flex: 1;
            font-family: arial;
            height: 25px;
            width: 350px;
       }
       button{
        width: 70px;
        color: white;
        background-color: blueviolet;
        border-color:white; 
        border-style: solid;
        height: 30px;
        padding: 3px;
       }

    </style>
</head>
<body>
   <div class="box">
        <div class="home">Home</div>
        <div>
            <input type="text" placeholder="Search">
        </div>
        <div>
            <button>Download</button>
        </div>
   </div>
</body>
</html>
