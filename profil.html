<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapsirma</title>

    <style>
        .box{
            width: 400px;
            border: 1px solid black;
            padding: 10px 15px;
            display: flex;
            flex-direction: row;
            align-items: center;
        }
        .photo{
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }

        p, h1{
            margin-top: 0;
            margin-bottom: 0;
        }

    </style>
</head>
<body>
    
    <div class="box">
        <div style="width: 60px;">
            <img class="photo" src="images.jpg" width="150px">
        </div>
        <div  style="flex: 1;">
            <div>
                <h1>Oliver</h1>
            </div>
            <div>
                <p>the cat</p>
            </div>
            <div>
                <p>Populer</p>
            </div>
        </div>
        <div style="width: 70px;">
            <button>Follow</button>
        </div>
    </div>

    <!-- 2 profile -->

    <div class="box">
        <div style="width: 60px;">
            <img class="photo" src="images (1).jpg" width="150px">
        </div>
        <div style="flex: 1;">
            <div>
                <h1>Mimi</h1>
            </div>
            <div>
                <p>Sleepy Cat</p>
            </div>
            <div>
                <p>Populer</p>
            </div>
        </div>
        <div style="width: 70px;">
            <button>Follow</button>
        </div>
    </div>

    <!-- 3-profile -->
    <div class="box">
        <div style="width: 60px;">
            <img class="photo" src="Без названия.jpg" width="150px">
        </div>
        <div style="flex: 1;">
            <div>
                <h1>Rex</h1>
            </div>
            <div>
                <p>Happy Bulldog</p>
            </div>
            <div>
                <p>Populer</p>
            </div>
        </div>
        <div style="width: 70px;">
            <button>Follow</button>
        </div>
    </div>
   

</body>
</html>
